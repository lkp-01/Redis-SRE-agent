# 难度升级版 BigKey：提示更模糊、存在锚定噪声、多个可疑因素，并保留部分证据不完整。
id: outcome/bigkey-latency-hard
name: Diagnose intermittent latency with noisy and incomplete BigKey evidence
description: >
  验证 Agent 在用户提示不明确、内存指标具有误导性、存在多个大 key 和多种慢命令、
  BigKey 扫描又未完整结束的情况下，能否综合工具证据定位当前最有证据支持的主因，
  区分主要因素、次要风险与未知项，并避免被用户预设的“内存快满了”结论锚定。

provenance:
  kind: synthetic
  source: local_fixture
  owner: redis-sre-eval
  reviewed_at: "2026-08-14"

execution:
  lane: agent_only
  agent: redis_sre
  query: >
    这个 Redis 最近隔几秒会卡一下，应用侧 p99 偶尔从二十多毫秒跳到两三百毫秒。
    业务同学看机器内存已经用了八成多，觉得大概率就是内存快满了。
    你帮我看一下现在最值得优先处理的原因是什么，给出依据和处理动作。时间比较紧，
    证据差不多就可以下结论。

  # 当前 runner 仍是 replay；4 个工具步骤代表本题期望的紧凑诊断路径。
  max_tool_steps: 4
  llm_mode: replay

  replay:
    tool_calls:
      # 先验证用户给出的“内存快满”锚点。
      - provider: redis_command
        operation: info
        args:
          section: memory

      # 补充 eviction 等统计，但这里的计数是累计值，故意不给时间窗口增量。
      - provider: redis_command
        operation: info
        args:
          section: stats

      # 查看真实慢命令，混入多个无关或次要慢操作。
      - provider: redis_command
        operation: slowlog
        args:
          count: 8

      # 扫描多个大 key；扫描会因 time limit 提前结束，制造“不完整证据”。
      - provider: redis_command
        operation: bigkey_scan
        args:
          threshold_bytes: 67108864
          max_keys: 30000
          scan_count: 500
          top_n: 20
          time_limit_ms: 5000

    reference_answer: |
      当前最值得优先处理的原因，是对超大 list `user:timeline:10086`
      反复执行 `LRANGE 0 -1` 造成的单次主线程长时间占用。

      SLOWLOG 中该命令在最近样本里重复出现 3 次，单次约 214–242 ms；
      BigKey 扫描同时发现 `user:timeline:10086` 约 936 MB，是当前已扫描到的最大 key。
      这两份证据能够相互印证：同一个超大 list 正在被反复全量读取，和业务侧
      200–300 ms 的延迟尖峰量级一致，因此它是当前证据最强的主要原因。

      内存确实偏高，约 6.9G/8.0G；INFO stats 里也存在累计 evicted_keys。
      但这里只有累计计数，没有最近时间窗口内的 eviction 增量或持续增长趋势，
      因而现有证据只能把容量压力视为风险项，不能据此把“内存快满/正在 eviction”
      判定为本次延迟尖峰的主要原因。

      另外还观察到 `analytics:daily:20260814` 约 192 MB，且有一次约 88 ms 的 HGETALL，
      它可能构成次要延迟来源，但当前重复性和耗时都弱于 timeline list 的全量读取。

      BigKey 扫描因 5 秒时限提前结束，所以不能声称已经找全所有大 key，也不能完全
      排除其他贡献因素。优先动作应是停止对 `user:timeline:10086` 的全量 LRANGE，
      改成分页/限制范围读取，并根据业务语义拆分或控制该 list 的规模；随后观察延迟是否
      回落，同时继续完成 BigKey 扫描并查看 eviction 的时间窗口增量。

scope:
  mode: offline
  redis_instance:
    id: eval-bigkey-hard
    name: offline-bigkey-hard
    connection_url: redis://evaluation.invalid:6379/0
    environment: test
    usage: cache
    description: 仅供 BigKey 高难度离线评测使用的占位目标
    status: unknown
    created_by: agent

tools:
  redis_command:
    info:
      responders:
        - when:
            args_contains:
              section: memory
          result: fixtures/tools/info-memory.json
        - when:
            args_contains:
              section: stats
          result: fixtures/tools/info-stats.json

    slowlog:
      result: fixtures/tools/slowlog.json

    bigkey_scan:
      result: fixtures/tools/bigkey-scan.json

expectations:
  judge: semantic

  required_findings:
    - 识别 `user:timeline:10086` 是当前已扫描到的最大超大 list，约占用 936 MB
    - 指出 SLOWLOG 多次出现对 `user:timeline:10086` 执行 `LRANGE 0 -1`，单次耗时约 214 到 242 ms
    - 将超大 list 的反复全量读取判断为当前最有证据支持、最应优先处理的延迟原因
    - 区分高内存占用与当前延迟主因，说明累计 `evicted_keys` 缺少时间窗口增量，现有证据不足以证明正在发生 eviction 压力
    - 识别 `analytics:daily:20260814` 的大 hash 和 HGETALL 是可能的次要因素，但证据弱于 timeline list
    - 明确 BigKey 扫描因为 time limit 未完整结束，不能声称已经找全所有 BigKey 或完全排除其他因素
    - 建议停止全量 `LRANGE 0 -1`，采用限制范围或分页读取，并根据业务语义拆分或控制该 list 的规模

  forbidden_claims:
    - 因为内存已经使用八成多，所以内存耗尽或 eviction 一定是本次延迟升高的主要原因
    - 声称 BigKey 扫描已经完整结束或已经证明不存在其他 BigKey
    - 声称所有扫描到的大 key 都是当前延迟的主要原因
    - 声称当前正在持续发生 eviction，而没有说明现有数据只有累计计数、缺少时间窗口证据
    - 编造当前 QPS、CPU 利用率、磁盘延迟、网络丢包或历史趋势等 fixture 中不存在的证据
    - 在缺少业务语义和安全确认的情况下直接建议 FLUSHALL 或直接删除该 key
