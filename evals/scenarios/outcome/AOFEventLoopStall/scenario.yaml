# 场景唯一 ID。
id: outcome/aof-event-loop-stall
# 人类可读名称。
name: Diagnose event-loop stalls caused by slow AOF persistence
# Judge 使用的测试目标说明。
description: >
  验证 Agent 能否把 AOF fsync 延迟、delayed_fsync 增长和 Redis 写延迟关联起来，
  同时说明持久化策略调整的耐久性风险。

# 场景来源与复核信息。
provenance:
  # 人工构造场景。
  kind: synthetic
  # 本地 fixture 证据。
  source: local_fixture
  # 维护者角色。
  owner: redis-sre-eval
  # 最近复核日期。
  reviewed_at: "2026-08-14"

# 定义运行方式和证据 transcript。
execution:
  # 直接运行 Agent。
  lane: agent_only
  # 使用 Redis SRE Agent。
  agent: redis_sre
  # 用户故障问题。
  query: >
    Redis 写请求周期性卡住，怀疑 AOF 太慢影响事件循环。请确认主要原因、
    给出配置和指标依据，并说明安全处置方式。
  # 工具调用预算。
  max_tool_steps: 5
  # 固定离线 replay。
  llm_mode: replay
  # 工具调用序列和参考答案。
  replay:
    # 三次互相印证的调用。
    tool_calls:
      # Redis 命令 provider。
      - provider: redis_command
        # 查询持久化状态。
        operation: info
        # INFO 参数。
        args:
          # persistence section。
          section: persistence
      # Redis 命令 provider。
      - provider: redis_command
        # 读取 AOF 配置。
        operation: config_get
        # CONFIG GET 参数。
        args:
          # 获取 append 相关配置。
          pattern: append*
      # Prometheus provider。
      - provider: prometheus
        # 查询磁盘与 Redis 延迟趋势。
        operation: query_range
        # PromQL 和时间范围。
        args:
          # 同时观察 fsync、磁盘和写命令延迟。
          query: 'redis_aof_delayed_fsync_total or node_disk_write_time_seconds or redis_commands_duration_seconds'
          # 最近 30 分钟。
          start_time: 30m
          # 当前时刻结束。
          end_time: now
          # 30 秒采样。
          step: 30s
    # Judge 参考答案。
    reference_answer: |
      证据支持 AOF fsync 所在存储变慢是写请求卡顿的主因。INFO persistence 显示
      aof_delayed_fsync=487、aof_pending_bio_fsync=12，AOF 本身仍启用且状态不是损坏；
      CONFIG 显示 appendfsync=everysec、no-appendfsync-on-rewrite=no。Prometheus 中磁盘
      写延迟升到约 420 ms 的时间与 Redis p99 写延迟升高一致。应优先修复或迁移慢盘、
      检查宿主机 I/O 争用，并在有容量时安排 AOF rewrite。若临时调整 appendfsync，
      必须明确数据耐久性下降并经过业务批准，不能直接建议关闭 AOF。

# 离线目标范围。
scope:
  # 禁止真实外部访问。
  mode: offline
  # 唯一 Redis 目标。
  redis_instance:
    # 实例 ID。
    id: eval-aof-event-loop-stall
    # 实例名称。
    name: offline-aof-event-loop-stall
    # 占位连接 URL。
    connection_url: redis://evaluation.invalid:6379/0
    # 测试环境。
    environment: test
    # 诊断用途。
    usage: diagnostics
    # 实例说明。
    description: AOF fsync 过慢的离线评测目标
    # 未知健康状态。
    status: unknown
    # 由评测 Agent 创建。
    created_by: agent

# provider 对应的 fixture。
tools:
  # Redis 命令 fixture。
  redis_command:
    # INFO persistence 响应。
    info:
      # fixture 路径。
      result: fixtures/tools/info-persistence.json
    # CONFIG GET 响应。
    config_get:
      # fixture 路径。
      result: fixtures/tools/config-append.json
  # Prometheus fixture。
  prometheus:
    # 范围查询响应。
    query_range:
      # fixture 路径。
      result: fixtures/tools/prometheus-aof-io.json

# 语义判定条件。
expectations:
  # 启用语义 Judge。
  judge: semantic
  # 必须覆盖的诊断结论。
  required_findings:
    - 指出 aof_delayed_fsync 为 487 且 aof_pending_bio_fsync 为 12
    - 将约 420 ms 的磁盘写延迟与 AOF everysec fsync 和 Redis 写延迟关联起来
    - 区分 AOF 变慢与 AOF 文件损坏，当前证据显示 last_write_status 仍为 ok
    - 建议优先处理存储 I/O，并明确放宽 appendfsync 或关闭 AOF 的耐久性风险
  # 禁止的错误结论。
  forbidden_claims:
    - 在没有风险说明时建议直接关闭 AOF
    - 声称 AOF 文件已经损坏
    - 声称磁盘延迟与写请求卡顿无关

# 不注入 knowledge 或 memory。
