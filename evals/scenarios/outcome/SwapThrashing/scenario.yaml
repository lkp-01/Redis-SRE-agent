# 场景唯一 ID。
id: outcome/swap-thrashing
# 人类可读名称。
name: Diagnose Redis latency caused by host swap thrashing
# Judge 使用的场景说明。
description: >
  验证 Agent 能否区分 Redis 自身 maxmemory/eviction 与宿主机物理内存不足，
  并通过 swap in/out 证据定位换页抖动造成的延迟。

# 来源与维护信息。
provenance:
  # 人工构造案例。
  kind: synthetic
  # 本地 fixture 证据。
  source: local_fixture
  # 维护者角色。
  owner: redis-sre-eval
  # 最近复核日期。
  reviewed_at: "2026-08-14"

# 运行定义。
execution:
  # 直接运行 Agent。
  lane: agent_only
  # Redis SRE Agent。
  agent: redis_sre
  # 用户问题。
  query: >
    Redis 延迟出现秒级尖峰，实例没有明显 eviction，但宿主机内存可能不足。
    请判断是否发生 swap 抖动，给出证据并提供安全处置建议。
  # 工具预算。
  max_tool_steps: 5
  # 固定离线 replay。
  llm_mode: replay
  # 三次调用和参考答案。
  replay:
    # 必须观察的证据。
    tool_calls:
      # Redis 命令 provider。
      - provider: redis_command
        # 查询 Redis 内存状态。
        operation: info
        # INFO 参数。
        args:
          # memory section。
          section: memory
      # Prometheus provider。
      - provider: prometheus
        # 查询当前宿主机可用内存与 swap。
        operation: query
        # PromQL 参数。
        args:
          # 返回 MemAvailable、SwapFree、SwapTotal 和 eviction 计数。
          query: 'node_memory_MemAvailable_bytes or node_memory_SwapFree_bytes or node_memory_SwapTotal_bytes or redis_evicted_keys_total'
      # Prometheus provider。
      - provider: prometheus
        # 查询 swap in/out 趋势。
        operation: query_range
        # PromQL 与时间范围。
        args:
          # 观察换页速率和 Redis 延迟。
          query: 'rate(node_vmstat_pswpin[5m]) or rate(node_vmstat_pswpout[5m]) or redis_commands_duration_seconds'
          # 最近 30 分钟。
          start_time: 30m
          # 当前结束。
          end_time: now
          # 30 秒采样。
          step: 30s
    # Judge 对照答案。
    reference_answer: |
      当前主因是宿主机物理内存不足引发 swap thrashing。Redis INFO memory 显示
      used_memory 约 6.4 GiB、RSS 约 6.7 GiB、evicted_keys=0，不能支持 Redis
      maxmemory 淘汰压力；Prometheus 显示 evicted_keys=0、主机 MemAvailable 仅约 180 MiB，8 GiB swap
      只剩约 128 MiB，同时 pswpin/pswpout 在延迟尖峰期间持续高位。应先降低宿主机
      内存压力或迁移/限流实例，给 Redis 配置包含系统与 fork 余量的 maxmemory，长期避免
      Redis 工作集进入 swap。不能在物理内存仍不足时直接 swapoff，否则可能触发 OOM。

# 离线目标范围。
scope:
  # fixture-only 模式。
  mode: offline
  # 唯一 Redis 实例。
  redis_instance:
    # 实例 ID。
    id: eval-swap-thrashing
    # 实例名称。
    name: offline-swap-thrashing
    # 占位 URL。
    connection_url: redis://evaluation.invalid:6379/0
    # 测试环境。
    environment: test
    # 诊断用途。
    usage: diagnostics
    # 实例说明。
    description: 宿主机内存不足与 swap 抖动的离线评测目标
    # 未知状态。
    status: unknown
    # 由 Agent 创建。
    created_by: agent

# provider fixture 映射。
tools:
  # Redis 命令 fixture。
  redis_command:
    # INFO memory 响应。
    info:
      # fixture 路径。
      result: fixtures/tools/info-memory.json
  # Prometheus fixture。
  prometheus:
    # 即时查询响应。
    query:
      # fixture 路径。
      result: fixtures/tools/prometheus-host-memory.json
    # 范围查询响应。
    query_range:
      # fixture 路径。
      result: fixtures/tools/prometheus-swap-rate.json

# 语义期望。
expectations:
  # 使用语义 Judge。
  judge: semantic
  # 必须覆盖的发现。
  required_findings:
    - 指出宿主机 MemAvailable 约 180 MiB，8 GiB swap 仅剩约 128 MiB
    - 指出 pswpin 和 pswpout 在延迟尖峰时持续升高
    - 说明 Redis evicted_keys 为 0，当前证据不支持 maxmemory 淘汰是主因
    - 建议降低宿主机内存压力并为 Redis 设置包含系统和 fork 余量的内存上限
  # 禁止的错误结论。
  forbidden_claims:
    - 把 swap 使用量直接解释为 Redis keyspace 大小
    - 建议在物理内存仍不足时直接执行 swapoff
    - 将 eviction 压力判断为当前主要原因

# 不注入 knowledge 或 memory。
