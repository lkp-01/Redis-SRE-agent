# 场景唯一 ID。
id: outcome/network-degradation
# 人类可读名称。
name: Diagnose Redis latency caused by network degradation
# Judge 使用的能力说明。
description: >
  验证 Agent 能否利用重传、丢包、探测时延和客户端超时日志定位网络退化，
  并避免在缺少证据时把问题归因于 Redis 命令执行。

# 来源与维护信息。
provenance:
  # 人工构造场景。
  kind: synthetic
  # 本地 fixture 证据。
  source: local_fixture
  # 维护者角色。
  owner: redis-sre-eval
  # 最近复核日期。
  reviewed_at: "2026-08-14"

# 运行定义。
execution:
  # 直接运行 Agent。
  lane: agent_only
  # Redis SRE Agent。
  agent: redis_sre
  # 用户问题。
  query: >
    应用访问 Redis 的 RTT 和超时突然增加，但 Redis 吞吐仍比较稳定。
    请判断是否为网络问题、给出证据并建议排查顺序。
  # 工具预算。
  max_tool_steps: 5
  # 固定离线 replay。
  llm_mode: replay
  # 工具调用与参考答案。
  replay:
    # 三组互相印证的证据。
    tool_calls:
      # Prometheus provider。
      - provider: prometheus
        # 查询网络趋势。
        operation: query_range
        # PromQL 与时间范围。
        args:
          # 观察 TCP 重传、网卡丢包和探测时延。
          query: 'rate(node_netstat_Tcp_RetransSegs[5m]) or rate(node_network_receive_drop_total[5m]) or probe_duration_seconds'
          # 最近 30 分钟。
          start_time: 30m
          # 当前结束。
          end_time: now
          # 30 秒采样。
          step: 30s
      # Redis 命令 provider。
      - provider: redis_command
        # 查询 Redis 服务器统计。
        operation: info
        # INFO 参数。
        args:
          # stats section。
          section: stats
      # Loki provider。
      - provider: loki
        # 查询客户端网络错误日志。
        operation: query_range
        # LogQL 与时间范围。
        args:
          # 筛选 Redis 客户端 timeout/reset。
          query: '{job="application"} |~ "redis.*(timeout|connection reset)"'
          # 最近 30 分钟。
          start: 30m
          # 当前结束。
          end: now
          # 最多 100 条。
          limit: 100
          # 最新优先。
          direction: backward
    # Judge 对照答案。
    reference_answer: |
      当前最有证据支持的是 Redis 客户端到服务端路径的网络退化。Prometheus 显示
      TCP 重传率从约 4/s 升至 860/s、接收丢包升至 1260/s，探测 RTT 从 2 ms
      升至约 185 ms；Loki 同一时间出现 redis timeout 和 connection reset。
      Redis INFO stats 中 instantaneous_ops_per_sec 仍约 48k、rejected_connections=0，
      不支持 Redis 拒绝连接或吞吐崩溃是主因。应按客户端节点、网络路径、Redis 主机网卡
      分段检查丢包/错误、交换机与安全策略、MTU和近期网络变更，并先限流重试风暴；
      不应无证据重启 Redis。

# 离线目标范围。
scope:
  # fixture-only 模式。
  mode: offline
  # 唯一 Redis 目标。
  redis_instance:
    # 实例 ID。
    id: eval-network-degradation
    # 实例名称。
    name: offline-network-degradation
    # 占位 URL。
    connection_url: redis://evaluation.invalid:6379/0
    # 测试环境。
    environment: test
    # 诊断用途。
    usage: diagnostics
    # 实例说明。
    description: Redis 访问路径网络退化的离线评测目标
    # 未知状态。
    status: unknown
    # 由 Agent 创建。
    created_by: agent

# provider fixture 映射。
tools:
  # Prometheus fixture。
  prometheus:
    # 网络范围查询响应。
    query_range:
      # fixture 路径。
      result: fixtures/tools/prometheus-network.json
  # Redis 命令 fixture。
  redis_command:
    # INFO stats 响应。
    info:
      # fixture 路径。
      result: fixtures/tools/info-stats.json
  # Loki fixture。
  loki:
    # 客户端日志响应。
    query_range:
      # fixture 路径。
      result: fixtures/tools/loki-client-network-errors.json

# 语义期望。
expectations:
  # 使用语义 Judge。
  judge: semantic
  # 必须覆盖的发现。
  required_findings:
    - 指出 TCP 重传约 860/s、接收丢包约 1260/s 且探测 RTT 约 185 ms
    - 将网络指标尖峰与客户端 timeout 和 connection reset 日志关联起来
    - 指出 Redis 吞吐仍约 48k ops/s 且 rejected_connections 为 0
    - 建议分段排查客户端、网络路径和 Redis 主机网卡，并控制重试风暴
  # 禁止的错误结论。
  forbidden_claims:
    - 在没有证据时把问题归因于 Redis 慢命令
    - 建议直接重启 Redis 作为主要修复
    - 声称没有网络丢包或重传证据

# 不注入 knowledge 或 memory。
