# 场景唯一 ID。
id: outcome/cpu-thread-contention
# 人类可读名称。
name: Diagnose Redis latency from insufficient CPU supply and thread contention
# Judge 使用的场景说明。
description: >
  验证 Agent 能否识别容器 CPU 配额不足、CFS throttling 和宿主机 run queue 竞争，
  并说明这类调度等待为何可能不会出现在 Redis SLOWLOG 中。

# 来源与维护信息。
provenance:
  # 人工构造案例。
  kind: synthetic
  # 本地 fixture 证据。
  source: local_fixture
  # 维护者角色。
  owner: redis-sre-eval
  # 最近复核日期。
  reviewed_at: "2026-08-14"

# 运行定义。
execution:
  # 直接运行 Agent。
  lane: agent_only
  # Redis SRE Agent。
  agent: redis_sre
  # 用户问题。
  query: >
    Redis 延迟升高但 SLOWLOG 几乎为空，容器 CPU 可能供给不足且线程竞争严重。
    请定位主要原因、解释证据并给出处置建议。
  # 工具预算。
  max_tool_steps: 5
  # 固定离线 replay。
  llm_mode: replay
  # 三次工具调用和参考答案。
  replay:
    # 必须执行的调用。
    tool_calls:
      # Redis 命令 provider。
      - provider: redis_command
        # 获取 Redis CPU 计数。
        operation: info
        # INFO 参数。
        args:
          # cpu section。
          section: cpu
      # Prometheus provider。
      - provider: prometheus
        # 查询 CPU 配额和争用趋势。
        operation: query_range
        # PromQL 与时间范围。
        args:
          # 对比进程 CPU、CFS throttling 和主机 load。
          query: 'rate(process_cpu_seconds_total[1m]) or rate(container_cpu_cfs_throttled_seconds_total[1m]) or node_load1'
          # 最近 30 分钟。
          start_time: 30m
          # 当前结束。
          end_time: now
          # 30 秒采样。
          step: 30s
      # Redis 命令 provider。
      - provider: redis_command
        # 检查命令自身执行是否变慢。
        operation: slowlog
        # SLOWLOG 参数。
        args:
          # 最近 20 条。
          count: 20
    # Judge 对照答案。
    reference_answer: |
      当前主因是 CPU 供给不足和调度竞争，而不是某条 Redis 命令执行很慢。
      Prometheus 显示 Redis 容器接近 1 核配额上限，CFS throttled 时间率升到 0.38 s/s，
      宿主机 node_load1 达 14.6；INFO cpu 同时显示主线程与 I/O thread CPU 持续增长。
      SLOWLOG 为空不能排除 CPU 调度等待，因为未被调度的等待不等同于命令在 Redis 内部
      执行超阈值。应增加或保证 CPU 配额、减少同机 noisy neighbor、检查 run queue 和绑核，
      再依据 profile 调整 I/O threads；不能盲目增加线程，因为会加剧有限 CPU 上的竞争。

# 离线目标范围。
scope:
  # fixture-only 模式。
  mode: offline
  # 唯一 Redis 目标。
  redis_instance:
    # 实例 ID。
    id: eval-cpu-thread-contention
    # 实例名称。
    name: offline-cpu-thread-contention
    # 占位 URL。
    connection_url: redis://evaluation.invalid:6379/0
    # 测试环境。
    environment: test
    # 诊断用途。
    usage: diagnostics
    # 目标说明。
    description: CPU 配额不足和线程竞争的离线评测目标
    # 未知状态。
    status: unknown
    # 由 Agent 创建。
    created_by: agent

# provider fixture 映射。
tools:
  # Redis 命令 fixture。
  redis_command:
    # INFO cpu 响应。
    info:
      # fixture 路径。
      result: fixtures/tools/info-cpu.json
    # SLOWLOG 响应。
    slowlog:
      # fixture 路径。
      result: fixtures/tools/slowlog-empty.json
  # Prometheus fixture。
  prometheus:
    # CPU 范围查询响应。
    query_range:
      # fixture 路径。
      result: fixtures/tools/prometheus-cpu-contention.json

# 语义期望。
expectations:
  # 使用语义 Judge。
  judge: semantic
  # 必须覆盖的发现。
  required_findings:
    - 指出容器接近 1 核配额且 CFS throttled 时间率约为 0.38 s/s
    - 指出宿主机 node_load1 为 14.6，存在明显 run queue 竞争
    - 解释 SLOWLOG 为空不能排除 CPU 调度等待
    - 建议保证 CPU 配额、减少 noisy neighbor，并在 profile 后再调整线程
  # 禁止的错误结论。
  forbidden_claims:
    - 因为 SLOWLOG 为空就断言 Redis 没有性能问题
    - 建议不经分析直接增加更多 I/O threads
    - 把 CFS throttling 解释为 Redis 内存淘汰

# 不注入 knowledge 或 memory。
