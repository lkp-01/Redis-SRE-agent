[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "redis-sre-agent"
version = "0.2.0"
description = "Redis SRE Agent 诊断切片与 Stage 8 最小 RAG 闭环"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.0.0,<9.0.0",
    "cryptography>=45.0.0,<46",
    "httpx>=0.25.0",
    "langchain-core>=1.4.0,<2.0.0",
    "langchain-openai>=1.2.1,<2.0.0",
    "langgraph>=1.2.0,<2.0.0",
    "mcp>=1.23.3,<2.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "prometheus-api-client>=0.6.0",
    "python-dotenv>=1.0.0",
    "PyYAML>=6.0.0",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "redis>=5.0.0",
    "redisvl>=0.9.0,<1.0",
    "requests>=2.31.0",
]

[project.scripts]
redis-sre-agent = "redis_sre_agent.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["redis_sre_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["-q"]
asyncio_mode = "auto"
markers = [
    "integration: 需要显式外部服务配置的集成测试",
]
